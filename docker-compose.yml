services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.18.4
    ports:
      - "5678:5678"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_ENCRYPTION_KEY=npE3pnkpHuF3ceNnz6iAX99WbdZSveB5
      # FIX FUSEAU HORAIRE TUNIS
      - TZ=Africa/Tunis
      - GENERIC_TIMEZONE=Africa/Tunis
      # Database PostgreSQL
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=host.docker.internal
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=admin
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: